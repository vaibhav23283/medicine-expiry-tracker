{% extends 'base.html' %}
{% block title %}Add Batch{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">📦 Add Batch</div>
        <div class="page-subtitle">Adding a batch will auto-fire expiry alert triggers</div>
    </div>
    <a href="{{ url_for('batches') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:800px">
    <div
        style="background:#FEF3C7;border-left:4px solid #D97706;padding:10px 14px;border-radius:8px;margin-bottom:20px;font-size:13px;color:#92400E">
        ⚡ <strong>Trigger Note:</strong> When you add a batch, the database will automatically check the expiry date and
        insert alerts if needed.
    </div>
    <form method="POST">
        <div class="form-grid">
            <div class="form-group"><label>Medicine *</label>
                <select name="medicine_id" required>
                    <option value="">Select medicine</option>
                    {% for m in medicines %}<option value="{{ m.medicine_id }}">{{ m.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group"><label>Supplier *</label>
                <select name="supplier_id" required>
                    <option value="">Select supplier</option>
                    {% for s in suppliers %}<option value="{{ s.supplier_id }}">{{ s.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group"><label>Batch Number *</label><input name="batch_number" required
                    placeholder="e.g. PARA-2025-003"></div>
            <div class="form-group"><label>Purchase Date *</label><input name="purchase_date" type="date" required>
            </div>
            <div class="form-group"><label>Manufacture Date *</label><input name="manufacture_date" type="date"
                    required></div>
            <div class="form-group"><label>Expiry Date *</label><input name="expiry_date" type="date" required></div>
            <div class="form-group"><label>Quantity *</label><input name="quantity_purchased" type="number" min="1"
                    required placeholder="100"></div>
            <div class="form-group"><label>Unit Price (₹) *</label><input name="unit_price" type="number" step="0.01"
                    min="0.01" required placeholder="5.50"></div>
        </div>
        <button type="submit" class="btn btn-primary">✅ Add Batch</button>
    </form>
</div>
{% endblock %}
