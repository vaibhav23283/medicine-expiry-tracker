{% extends 'base.html' %}
{% block title %}Add Medicine{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">💊 Add Medicine</div>
    </div>
    <a href="{{ url_for('medicines') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:700px">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group"><label>Medicine Name *</label><input name="name" required
                    placeholder="e.g. Paracetamol 500mg"></div>
            <div class="form-group"><label>Category *</label>
                <select name="category" required>
                    <option value="">Select category</option>
                    <option>Analgesic</option>
                    <option>Antibiotic</option>
                    <option>Antidiabetic</option>
                    <option>Antilipemic</option>
                    <option>Antihistamine</option>
                    <option>Antacid</option>
                    <option>Antihypertensive</option>
                    <option>Supplement</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="form-group"><label>Dosage Form *</label>
                <select name="dosage_form" required>
                    <option>Tablet</option>
                    <option>Capsule</option>
                    <option>Syrup</option>
                    <option>Injection</option>
                    <option>Cream</option>
                    <option>Drops</option>
                </select>
            </div>
            <div class="form-group"><label>Manufacturer *</label><input name="manufacturer" required
                    placeholder="e.g. Sun Pharma"></div>
            <div class="form-group"><label>Min Stock Level *</label><input name="min_stock_level" type="number" min="1"
                    required value="10"></div>
        </div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="2"
                placeholder="Brief description..."></textarea></div>
        <button type="submit" class="btn btn-primary">✅ Add Medicine</button>
    </form>
</div>
{% endblock %}
