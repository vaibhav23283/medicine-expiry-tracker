{% extends 'base.html' %}
{% block title %}Add Supplier{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">🚚 Add Supplier</div>
    </div>
    <a href="{{ url_for('suppliers') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:700px">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group"><label>Supplier Name *</label><input name="name" required
                    placeholder="e.g. MedSupply India Pvt Ltd"></div>
            <div class="form-group"><label>Contact Number *</label><input name="contact_number" required
                    placeholder="9876543210"></div>
            <div class="form-group"><label>Email *</label><input name="email" type="email" required
                    placeholder="supplier@gmail.com"></div>
            <div class="form-group"><label>City *</label><input name="city" required placeholder="Bangalore"></div>
            <div class="form-group"><label>State *</label><input name="state" required value="Karnataka"></div>
            <div class="form-group"><label>GST Number</label><input name="gst_number" placeholder="GST29AAAAA1234A1Z5">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">✅ Add Supplier</button>
    </form>
</div>
{% endblock %}
