{% extends 'base.html' %}
{% block title %}Edit Medicine{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">✏️ Edit Medicine</div>
    </div>
    <a href="{{ url_for('medicines') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:700px">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group"><label>Medicine Name *</label><input name="name" value="{{ med.name }}" required>
            </div>
            <div class="form-group"><label>Category *</label><input name="category" value="{{ med.category }}" required>
            </div>
            <div class="form-group"><label>Dosage Form *</label><input name="dosage_form" value="{{ med.dosage_form }}"
                    required></div>
            <div class="form-group"><label>Manufacturer *</label><input name="manufacturer"
                    value="{{ med.manufacturer }}" required></div>
            <div class="form-group"><label>Min Stock Level *</label><input name="min_stock_level" type="number"
                    value="{{ med.min_stock_level }}" required></div>
        </div>
        <div class="form-group"><label>Description</label><textarea name="description"
                rows="2">{{ med.description or '' }}</textarea></div>
        <button type="submit" class="btn btn-success">💾 Update Medicine</button>
    </form>
</div>
{% endblock %}
